<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#011812" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with Android safe zone padding -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3" />

  <!-- Sun in background -->
  <circle cx="360" cy="150" r="48" fill="url(#sunGrad)" filter="url(#glow)" opacity="0.9" />

  <!-- Isometric Ground Block -->
  <g transform="translate(256, 380)">
    <!-- Top Face -->
    <polygon points="0,-48 140,-12 0,24 -140,-12" fill="#047857" />
    <!-- Left Face -->
    <polygon points="-140,-12 0,24 0,68 -140,32" fill="#065f46" />
    <!-- Right Face -->
    <polygon points="0,24 140,-12 140,32 0,68" fill="#064e3b" />
    <!-- Grass highlight -->
    <polygon points="0,-48 140,-12 0,24 -140,-12" fill="#34d399" opacity="0.25" />
  </g>

  <!-- Stylized Evergreen 3D Pine Tree -->
  <!-- Tree Trunk -->
  <polygon points="246,365 266,365 264,285 248,285" fill="url(#trunkGrad)" />

  <!-- Bottom Tier -->
  <polygon points="256,180 345,295 167,295" fill="url(#leafGrad)" />
  <polygon points="256,180 256,295 167,295" fill="#059669" opacity="0.35" />

  <!-- Middle Tier -->
  <polygon points="256,130 325,225 187,225" fill="url(#leafGrad)" />
  <polygon points="256,130 256,225 187,225" fill="#059669" opacity="0.35" />

  <!-- Top Tier -->
  <polygon points="256,80 305,160 207,160" fill="url(#leafGrad)" />
  <polygon points="256,80 256,160 207,160" fill="#059669" opacity="0.35" />

  <!-- Glowing Eco Sparkles -->
  <circle cx="160" cy="200" r="6" fill="#6ee7b7" filter="url(#glow)" />
  <circle cx="350" cy="260" r="5" fill="#6ee7b7" filter="url(#glow)" />
  <circle cx="210" cy="110" r="4" fill="#fde047" filter="url(#glow)" />
</svg>
